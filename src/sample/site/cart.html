<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Northstar · Your cart</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#182522;background:#edf3ef}body{margin:0}.shell{max-width:820px;margin:42px auto;padding:24px}.brand{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#39766b}.card{background:#fff;border:1px solid #dce7e1;border-radius:18px;padding:25px;box-shadow:0 10px 35px #284c3c0c;margin-top:22px}h1{font-size:30px;margin:6px 0 20px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e5ece7}.cta{display:inline-block;padding:13px 17px;border-radius:10px;background:#176b5c;color:#fff;text-decoration:none;font-weight:700}.cta:focus{outline:3px solid #f0aa4b;outline-offset:3px}.ghost{display:inline-block;padding:11px 15px;border:1px solid #bdcbc4;border-radius:9px;background:#fff;color:#53625e;font:inherit;font-weight:600;cursor:pointer}.actions{display:flex;gap:12px;align-items:center;margin-top:20px}.small{color:#67736f;font-size:13px;line-height:1.55}.links{margin-top:20px;font-size:14px}.links a{color:#176b5c}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">Northstar Supply</div>
    <h1>Your cart</h1>
    <section class="card" aria-label="Cart contents">
      <div class="row" id="cart-row"><span>Everyday carry set</span><strong>$48.00</strong></div>
      <div class="actions">
        <a class="cta" href="/sample/checkout">Proceed to checkout</a>
        <button class="ghost" type="button" id="remove-item">Remove item</button>
      </div>
      <p class="small">This local demo cart holds no payment details. “Remove item” is recorded but never activated because it would change the shopping state.</p>
    </section>
    <nav class="links" aria-label="Cart links"><a href="/sample/catalog">Continue shopping</a></nav>
  </main>
  <script>
    document.getElementById('remove-item').addEventListener('click', () => {
      document.getElementById('cart-row').remove();
    });
  </script>
</body>
</html>
