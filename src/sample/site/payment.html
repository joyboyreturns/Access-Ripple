<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar · Payment preview</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#edf3ef;color:#182522;margin:0}.card{max-width:620px;margin:12vh auto;background:#fff;border:1px solid #dce7e1;border-radius:18px;padding:32px;box-shadow:0 10px 35px #284c3c14}.tag{color:#39766b;text-transform:uppercase;letter-spacing:.16em;font-size:12px}h1{font-size:30px}.error{border-left:4px solid #d26a61;background:#fff3f1;padding:14px 16px;border-radius:0 10px 10px 0}.back{color:#176b5c}.button{display:inline-block;padding:11px 15px;border:1px solid #176b5c33;border-radius:9px;background:#176b5c;color:#fff;font:inherit;font-weight:650;cursor:pointer;margin-top:6px}.button:disabled{opacity:.65;cursor:wait}.button:focus{outline:3px solid #f0aa4b;outline-offset:3px}.status{color:#67736f;font-size:13px;margin-top:10px}@media(max-width:680px){.card{margin:20px;padding:22px}}</style></head>
<body><main class="card"><div class="tag">Northstar · Local demo</div><h1>Payment preview</h1><p>This route is simulated; no payment processor is connected.</p><div class="error" role="alert"><strong>Gateway timeout.</strong> The demo payment service did not respond. Your order has not been submitted.</div><p><button class="button" type="button" id="retry-payment">Retry payment</button></p><p class="status" id="retry-status" hidden></p><p><a class="back" href="/sample/checkout">Return to checkout</a></p><script>console.error('AccessRipple demo: simulated payment gateway timeout. No payment was sent.');document.getElementById('retry-payment').addEventListener('click',()=>{const button=document.getElementById('retry-payment');button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='Retrying…';window.setTimeout(()=>{button.disabled=false;button.removeAttribute('aria-busy');button.textContent='Retry payment';const status=document.getElementById('retry-status');status.textContent='The simulated gateway failed again. No payment was sent.';status.hidden=false;},1600);});</script></main></body></html>
